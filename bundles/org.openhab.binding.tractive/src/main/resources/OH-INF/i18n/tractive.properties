# channel types

channel-type.tractive.activity-goal.label = Activity Goal
channel-type.tractive.activity-goal.description = Daily activity time goal
channel-type.tractive.activity-recorded.label = Active Time
channel-type.tractive.activity-recorded.description = Total time of activity recorded today
channel-type.tractive.activity-synced-at.label = Activity Synced At
channel-type.tractive.activity-synced-at.description = Time when the activity data was last synced from the tracker
channel-type.tractive.bark-status.label = Bark Status
channel-type.tractive.bark-status.description = Bark detection status from health overview (e.g. NORMAL, ELEVATED)
channel-type.tractive.battery-state.label = Battery State
channel-type.tractive.battery-state.description = Battery health state (e.g. FULL, REGULAR, LOW)
channel-type.tractive.birthday.label = Birthday
channel-type.tractive.birthday.description = The pet's date of birth, as entered in the Tractive app. Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.breed-ids.label = Breed IDs
channel-type.tractive.breed-ids.description = Comma-separated Tractive internal breed-catalog ID(s); not human-readable breed names. Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.buzzer.label = Buzzer
channel-type.tractive.buzzer.description = Activates or deactivates the tracker buzzer
channel-type.tractive.charging-state.label = Charging State
channel-type.tractive.charging-state.description = Current charging state (e.g. CHARGING, NOT_CHARGING)
channel-type.tractive.control-remaining.label = Command Remaining
channel-type.tractive.control-remaining.description = Seconds left before this activation auto-stops
channel-type.tractive.control-timeout.label = Command Timeout
channel-type.tractive.control-timeout.description = Configured maximum duration this activation is allowed to run before auto-stopping
channel-type.tractive.firmware-version.label = Firmware Version
channel-type.tractive.firmware-version.description = Onboard firmware version string
channel-type.tractive.gender.label = Gender
channel-type.tractive.gender.description = The pet's sex (M or F). Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.geofence-sensitivity.label = Geofence Sensitivity
channel-type.tractive.geofence-sensitivity.description = Configured geofence entry/exit detection sensitivity (e.g. HIGH)
channel-type.tractive.home-location.label = Home Location
channel-type.tractive.home-location.description = The pet's configured home location, as entered in the Tractive app. Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.hw-edition.label = Hardware Edition
channel-type.tractive.hw-edition.description = Hardware color/edition variant of the physical unit (e.g. BROWN-LINES)
channel-type.tractive.last-contact.label = Last Contact
channel-type.tractive.last-contact.description = Time of the most recent successful contact with this tracker, via REST poll or real-time channel event
channel-type.tractive.last-position-time.label = Last Position Time
channel-type.tractive.last-position-time.description = Time of the most recent position report
channel-type.tractive.led.label = LED
channel-type.tractive.led.description = Activates or deactivates the tracker LED
channel-type.tractive.live-tracking.label = Live Tracking
channel-type.tractive.live-tracking.description = Enables or disables live tracking mode (higher GPS update rate)
channel-type.tractive.model-number.label = Model Number
channel-type.tractive.model-number.description = Tractive hardware model code (e.g. TG6C)
channel-type.tractive.neutered.label = Neutered
channel-type.tractive.neutered.description = Whether the pet is spayed/neutered, as entered in the Tractive app. Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.pet-height.label = Height
channel-type.tractive.pet-height.description = The pet's height, as entered in the Tractive app. Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.pet-weight.label = Weight
channel-type.tractive.pet-weight.description = The pet's weight, as entered in the Tractive app. Only refreshed at Thing setup or via the "Refresh profile" action.
channel-type.tractive.position-accuracy.label = Position Accuracy
channel-type.tractive.position-accuracy.description = Estimated position uncertainty in metres (always 30 for KNOWN_WIFI)
channel-type.tractive.power-saving-zone-id.label = Power Saving Zone ID
channel-type.tractive.power-saving-zone-id.description = Internal ID of the tracker's configured Power Saving Zone
channel-type.tractive.profile-last-updated.label = Profile Last Updated
channel-type.tractive.profile-last-updated.description = Time the Profile channel group was last fetched — at Thing setup or via the "Refresh profile" action, never on the regular polling schedule
channel-type.tractive.resting-heart-rate-status.label = Heart Rate Status
channel-type.tractive.resting-heart-rate-status.description = Heart rate status from health overview (e.g. NORMAL)
channel-type.tractive.resting-respiratory-rate-status.label = Respiratory Rate Status
channel-type.tractive.resting-respiratory-rate-status.description = Respiratory rate status from health overview (e.g. NORMAL)
channel-type.tractive.scratch-status.label = Scratch Status
channel-type.tractive.scratch-status.description = Scratch detection status from health overview (e.g. INFREQUENT)
channel-type.tractive.sensor-used.label = Sensor Used
channel-type.tractive.sensor-used.description = Positioning sensor used for the last fix (GPS, KNOWN_WIFI, PHONE)
channel-type.tractive.sleep-calm.label = Calm Time
channel-type.tractive.sleep-calm.description = Total time of calm (resting but not sleep) today
channel-type.tractive.sleep-day.label = Daytime Sleep
channel-type.tractive.sleep-day.description = Total time of daytime sleep today
channel-type.tractive.sleep-night.label = Night Sleep
channel-type.tractive.sleep-night.description = Total time of night-time sleep today
channel-type.tractive.speed.label = Speed
channel-type.tractive.speed.description = Current movement speed (null when stationary)
channel-type.tractive.tracker-state-reason.label = Tracker State Reason
channel-type.tractive.tracker-state-reason.description = Why the tracker's operational state is what it is (e.g. POWER_SAVING, STALE_POSITION)
channel-type.tractive.tracker-state.label = Tracker State
channel-type.tractive.tracker-state.description = Operational state of the tracker (e.g. OPERATIONAL)
channel-type.tractive.unseen-health-alerts.label = Unseen Health Alerts
channel-type.tractive.unseen-health-alerts.description = Number of unseen health alerts
channel-type.tractive.zone-entered-at.label = Zone Entered At
channel-type.tractive.zone-entered-at.description = Time the tracker entered its currently most relevant geofence zone
channel-type.tractive.zone-id.label = Zone ID
channel-type.tractive.zone-id.description = Internal ID of the geofence zone currently most relevant to the tracker's position
channel-type.tractive.zone-last-seen-at.label = Zone Last Seen At
channel-type.tractive.zone-last-seen-at.description = Time the tracker was last confirmed still inside its currently most relevant geofence zone
channel-type.tractive.zone-type.label = Zone Type
channel-type.tractive.zone-type.description = Kind of the currently most relevant geofence zone (POWER_SAVING, SAFE, DANGER)

