# add-on

addon.tractive.name = Tractive Binding
addon.tractive.description = Integrates Tractive GPS pet trackers with openHAB. Provides real-time location, battery status, health and activity data, and remote commands (buzzer, LED, live tracking) via the unofficial Tractive cloud API.

# thing types

thing-type.tractive.account.label = Tractive Account
thing-type.tractive.account.description = Connects to the Tractive cloud using your account credentials. All tracker things require this bridge.
thing-type.tractive.dog-6.label = Tractive Dog 6
thing-type.tractive.dog-6.description = A Tractive Dog 6 GPS pet tracker. Provides real-time location, battery, health data, and commands.

# thing types config

thing-type.config.tractive.account.email.label = Email
thing-type.config.tractive.account.email.description = Tractive account email address
thing-type.config.tractive.account.password.label = Password
thing-type.config.tractive.account.password.description = Tractive account password
thing-type.config.tractive.dog-6.refreshInterval.label = Refresh Interval
thing-type.config.tractive.dog-6.refreshInterval.description = How often to re-poll position, hardware battery level, and health/dog data as a backstop alongside the real-time channel (seconds). Set to 0 to disable. Tracker Status, Device Info, and Profile are never on this interval.
thing-type.config.tractive.dog-6.trackedPetId.label = Pet ID
thing-type.config.tractive.dog-6.trackedPetId.description = Tractive pet (trackable object) ID linked to this tracker
thing-type.config.tractive.dog-6.trackerId.label = Tracker ID
thing-type.config.tractive.dog-6.trackerId.description = 8-character Tractive tracker hardware ID (e.g. "HBDYUFSC")

